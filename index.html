<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایت متین</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      transition: 0.3s;
    }

    nav {
      background: #222;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 10px;
    }

    header, section {
      max-width: 700px;
      margin: 25px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      text-align: center;
    }

    input {
      padding: 12px;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin: 8px 0;
      background: #eee;
      border-radius: 8px;
    }

    li span {
      flex: 1;
      text-align: right;
    }

    .done span {
      text-decoration: line-through;
    }

    .delete-btn {
      background: #d33;
      color: white;
    }

    .dark {
      background: #181818;
      color: white;
    }

    .dark header,
    .dark section {
      background: #292929;
    }

    .bg-blue {
      background: #dceeff;
    }

    .bg-pink {
      background: #ffe0eb;
    }

    .bg-green {
      background: #dcffe4;
    }

    #topButton {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: none;
    }

    #topButton.visible {
      display: block;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">خانه</a>
    <a href="about.html">درباره من</a>
    <a href="contact.html">تماس با من</a>
  </nav>

  <header>
    <h1>سلام! من متین هستم 👋</h1>
    <p>به سایت من خوش آمدی!</p>
  </header>

  <section>
    <h2>📝 لیست کارها</h2>

    <form id="todoForm">
      <input id="todoInput" type="text" placeholder="یک کار بنویس...">
      <button type="submit">اضافه کردن</button>
    </form>

    <ul id="todoList"></ul>

    <p id="todoInfo"></p>
  </section>

  <section>
    <h2>⚙️ تنظیمات</h2>

    <button id="themeButton" onclick="toggleTheme()">
      🌙 حالت شب
    </button>

    <br>

    <button onclick="changeColor('default')">رنگ پیش‌فرض</button>
    <button onclick="changeColor('blue')">آبی</button>
    <button onclick="changeColor('pink')">صورتی</button>
    <button onclick="changeColor('green')">سبز</button>
  </section>

  <section>
    <h2>👋 پیام</h2>

    <button onclick="showMessage()">نمایش پیام</button>

    <p id="message"></p>
  </section>

  <section>
    <h2>💪 جمله انگیزشی</h2>

    <p id="quote">برای دیدن جمله جدید روی دکمه بزن.</p>

    <button onclick="newQuote()">جمله جدید</button>
  </section>

  <button id="topButton" onclick="goTop()">⬆️</button>

  <script>

    /* ذخیره و خواندن اطلاعات */

    function saveData(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function loadData(key, defaultValue) {
      const data = localStorage.getItem(key);

      if (data === null) {
        return defaultValue;
      }

      try {
        return JSON.parse(data);
      } catch {
        return defaultValue;
      }
    }


    /* لیست کارها */

    let todos = loadData("matinTodos", []);

    if (!Array.isArray(todos)) {
      todos = [];
    }

    function renderTodos() {

      const list = document.getElementById("todoList");

      list.replaceChildren();

      todos.forEach(function(todo, index) {

        const item = document.createElement("li");

        if (todo.done) {
          item.classList.add("done");
        }

        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = Boolean(todo.done);

        checkbox.addEventListener("change", function() {

          todos[index].done = checkbox.checked;

          saveData("matinTodos", todos);

          renderTodos();

        });


        const text = document.createElement("span");

        text.textContent = todo.text;


        const remove = document.createElement("button");

        remove.textContent = "حذف";

        remove.className = "delete-btn";

        remove.addEventListener("click", function() {

          todos.splice(index, 1);

          saveData("matinTodos", todos);

          renderTodos();

        });


        item.append(checkbox, text, remove);

        list.appendChild(item);

      });


      const completed = todos.filter(function(todo) {
        return todo.done;
      }).length;


      document.getElementById("todoInfo").textContent =
        "تعداد کارها: " + todos.length +
        " | انجام‌شده: " + completed;

    }


    document.getElementById("todoForm").addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const input = document.getElementById("todoInput");

        const text = input.value.trim();

        if (!text) {
          return;
        }

        todos.push({
          text: text,
          done: false
        });

        saveData("matinTodos", todos);

        input.value = "";

        renderTodos();

      }
    );


    renderTodos();


    /* حالت شب و روز */

    let dark = loadData("matinDark", false) === true;


    function renderTheme() {

      document.body.classList.toggle("dark", dark);

      document.getElementById("themeButton").textContent =
        dark ? "☀️ حالت روز" : "🌙 حالت شب";

    }


    function toggleTheme() {

      dark = !dark;

      saveData("matinDark", dark);

      renderTheme();

    }


    renderTheme();


    /* تغییر رنگ */

    let bgColor = loadData("matinColor", "default");


    function renderColor() {

      document.body.classList.remove(
        "bg-blue",
        "bg-pink",
        "bg-green"
      );

      if (
        ["blue", "pink", "green"].includes(bgColor)
      ) {
        document.body.classList.add("bg-" + bgColor);
      }

    }


    function changeColor(color) {

      if (
        !["default", "blue", "pink", "green"].includes(color)
      ) {
        return;
      }

      bgColor = color;

      saveData("matinColor", bgColor);

      renderColor();

    }


    renderColor();


    /* پیام */

    function showMessage() {

      document.getElementById("message").textContent =
        "سلام متین! ادامه بده؛ داری برنامه‌نویسی یاد می‌گیری! 🎉";

    }


    /* جمله‌های انگیزشی */

    const quotes = [

      "هر روز یک قدم به هدفت نزدیک‌تر شو.",

      "اشتباه کردن بخشی از یادگیری است.",

      "با تمرین، کارهای سخت آسان‌تر می‌شوند.",

      "یک پروژه کوچک، شروع یک مهارت بزرگ است.",

      "صبور باش و به یادگیری ادامه بده."

    ];


    function newQuote() {

      const index =
        Math.floor(Math.random() * quotes.length);

      document.getElementById("quote").textContent =
        quotes[index];

    }


    /* بازگشت به بالای صفحه */

    const topButton =
      document.getElementById("topButton");


    window.addEventListener("scroll", function() {

      topButton.classList.toggle(
        "visible",
        window.scrollY > 300
      );

    });


    function goTop() {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  </script>

</body>
</html>
