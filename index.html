
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وب‌سایت متین</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Tahoma, Arial, sans-serif;
  background: #101827;
  color: white;
  transition: background 0.4s;
  line-height: 1.9;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: linear-gradient(135deg, #6d28d9, #2563eb);
  border-radius: 20px;
  margin-bottom: 20px;
}

h1 {
  font-size: 30px;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 22px;
  border-radius: 16px;
  margin: 18px auto;
  max-width: 700px;
}

button {
  background: #7c3aed;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 16px;
  cursor: pointer;
  margin: 6px 0;
}

button:hover {
  background: #5b21b6;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #777;
  border-radius: 8px;
  font-size: 16px;
}

.skill {
  background: #333e50;
  height: 12px;
  border-radius: 10px;
  overflow: hidden;
}

.progress {
  height: 100%;
  background: #a78bfa;
  border-radius: 10px;
}

a {
  color: #c4b5fd;
}

footer {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header id="home">
  <h1>سلام! من متین هستم 👋</h1>
  <p>به وب‌سایت شخصی من خوش آمدی.</p>
  <button onclick="changeColor()">🎨 تغییر رنگ پس‌زمینه</button>
</header>

<section class="card" id="about">
  <h2>👨‍💻 درباره من</h2>
  <p>من متین هستم و دارم برنامه‌نویسی و طراحی سایت یاد می‌گیرم.</p>
</section>

<section class="card" id="skills">
  <h2>💻 مهارت‌های من</h2>

  <p>HTML</p>
  <div class="skill">
    <div class="progress" style="width: 80%"></div>
  </div>

  <p>CSS</p>
  <div class="skill">
    <div class="progress" style="width: 60%"></div>
  </div>

  <p>JavaScript</p>
  <div class="skill">
    <div class="progress" style="width: 30%"></div>
  </div>
</section>

<section class="card" id="greeting">
  <h2>👋 خوشامدگویی با اسم تو</h2>
  <p>اسمت رو وارد کن تا بهت سلام کنم!</p>

  <input id="nameInput" type="text" placeholder="اسم تو چیه؟">

  <button onclick="greet()">سلام کن 👋</button>

  <p id="greetingResult" aria-live="polite"></p>
</section>

<section class="card" id="contact">
  <h2>📩 تماس با من</h2>
  <p>یک پیام آزمایشی بنویس:</p>

  <textarea id="messageInput" rows="4"
    placeholder="پیامت رو بنویس..."></textarea>

  <button onclick="showMessage()">نمایش پیام</button>
  <p id="messageResult" aria-live="polite"></p>
</section>

<footer>
  ساخته شده با ❤️ توسط متین
</footer>

<script>
function changeColor() {
  const colors = [
    "#101827",
    "#12352b",
    "#352044",
    "#3b2525",
    "#18344a"
  ];

  const currentColor = document.body.style.backgroundColor;
  const index = colors.indexOf(currentColor);
  const nextIndex = (index + 1) % colors.length;

  document.body.style.backgroundColor = colors[nextIndex];
}

function greet() {
  const name = document.getElementById("nameInput").value.trim();
  const result = document.getElementById("greetingResult");

  if (name === "") {
    result.textContent = "لطفاً اول اسمت رو وارد کن!";
  } else {
    result.textContent = "سلام " + name + " جان! خوش اومدی 🎉";
  }
}

function showMessage() {
  const message = document.getElementById("messageInput").value.trim();
  const result = document.getElementById("messageResult");

  if (message === "") {
    result.textContent = "اول یک پیام بنویس!";
  } else {
    result.textContent = "پیامت: " + message;
  }
}
</script>

</body>
</html>
