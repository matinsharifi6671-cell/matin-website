
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تماس با من | سلطان وب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">👑 سلطان وب</a>
  <nav>
  <a href="index.html">خانه</a>
  <a href="about.html">درباره من</a>
  <a href="projects.html">پروژه‌های من</a>
  <a href="contact.html">تماس با من</a>
</nav>
  <button id="themeButton" type="button">🌙 حالت شب</button>
</header>

<main>
  <section class="hero">
    <h1>📩 تماس با من</h1>
    <p>از این فرم آزمایشی برای تمرین استفاده کن.</p>
  </section>

  <section class="container">
    <div class="card">
      <form id="contactForm">
        <label for="name">نام</label>
        <input id="name" name="name" maxlength="80"
          placeholder="نامت را بنویس" required>

        <p><label for="email">ایمیل</label></p>
        <input id="email" name="email" type="email"
          placeholder="ایمیل آزمایشی" required>

        <p><label for="userMessage">پیام</label></p>
        <textarea id="userMessage" name="message" rows="5"
          maxlength="1000" placeholder="پیامت را بنویس"
          required></textarea>

        <div class="button-row">
          <button type="submit">نمایش پیام</button>
        </div>
      </form>
      <p id="formResult" aria-live="polite"></p>
      <p class="muted">این فرم پیام را به اینترنت یا ایمیل ارسال نمی‌کند.</p>
    </div>
  </section>
</main>

<footer>© ۲۰۲۶ متین وب</footer>
<script src="script.js"></script>
</body>
</html>
