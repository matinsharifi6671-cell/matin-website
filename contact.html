
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تماس با من | متین وب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">🚀 متین وب</div>

  <nav>
    <a href="index.html">خانه</a>
    <a href="about.html">درباره من</a>
    <a class="active" href="contact.html">تماس با من</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>تماس با من 💌</h1>
    <p>پیامت را در فرم زیر بنویس.</p>
  </section>

  <section class="container">
    <div class="content-box">
      <h2>فرم پیام</h2>

      <form id="contactForm">
        <label for="name">نام</label>
        <input
          id="name"
          type="text"
          placeholder="نامت را بنویس"
          maxlength="60"
          required
        >

        <label for="message">پیام</label>
        <textarea
          id="message"
          placeholder="پیامت را بنویس"
          maxlength="1000"
          required
        ></textarea>

        <button class="button" type="submit">
          نمایش پیام
        </button>
      </form>

      <p id="result" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer>
  <p>© ۲۰۲۶ متین وب | ساخته‌شده با ❤️</p>
</footer>

<script>
  document.getElementById("contactForm").addEventListener(
    "submit",
    function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();
      const result = document.getElementById("result");

      if (!name || !message) {
        result.textContent = "لطفاً هر دو قسمت را پر کن.";
        return;
      }

      result.textContent =
        "ممنون " + name + "! پیام نمایشی تو آماده است. 😊";
    }
  );
</script>

</body>
</html>
