<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلطان وب | تماس</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <a class="logo" href="index.html">
    👑 سلطان وب
  </a>

  <nav class="nav-menu">
    <a href="index.html">خانه</a>
    <a href="about.html">درباره من</a>
    <a href="projects.html">پروژه‌ها</a>
    <a class="active" href="contact.html">تماس</a>
  </nav>

</header>

<main>

<section class="page-title">

  <h1>📩 تماس با من</h1>

  <p>
    اگر پیامی داری، از فرم زیر استفاده کن.
  </p>

</section>

<section class="container">

  <div class="card contact-card">

    <form id="contactForm">

      <label for="name">
        نام:
      </label>

      <input
        id="name"
        type="text"
        placeholder="نامت را بنویس"
        required
      >

      <label for="email">
        ایمیل:
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        required
      >

      <label for="contactMessage">
        پیام:
      </label>

      <textarea
        id="contactMessage"
        rows="6"
        placeholder="پیامت را بنویس..."
        required
      ></textarea>

      <button class="btn" type="submit">
        🚀 ارسال پیام
      </button>

      <p id="contactResult" class="message"></p>

    </form>

  </div>

</section>

</main>

<footer class="site-footer">

  <div class="footer-links">
    <a href="index.html">خانه</a>
    <a href="about.html">درباره من</a>
    <a href="projects.html">پروژه‌ها</a>
    <a href="contact.html">تماس</a>
  </div>

  <p>
    © ۲۰۲۶ سلطان وب | کدنویسی امروز، موفقیت فردا 🚀
  </p>

</footer>

<script src="script.js"></script>

</body>
</html>
